name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install Twigpad
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check data files
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate data/io.github.rishabh3354.Twigpad.desktop
