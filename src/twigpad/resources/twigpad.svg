<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Twigpad</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ed08a"/>
      <stop offset="1" stop-color="#159a64"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6a45"/>
      <stop offset="1" stop-color="#6e4a2e"/>
    </linearGradient>
  </defs>

  <!-- soft shadow (layered, so every SVG renderer draws it) -->
  <rect x="28" y="30" width="208" height="214" rx="46" fill="#0d3b26" opacity="0.07"/>
  <rect x="26" y="26" width="208" height="214" rx="46" fill="#0d3b26" opacity="0.10"/>

  <!-- the page -->
  <rect x="24" y="20" width="208" height="214" rx="44" fill="url(#page)"/>

  <!-- header band with three binding dots -->
  <path d="M24 64 A44 44 0 0 1 68 20 H188 A44 44 0 0 1 232 64 V74 H24 Z" fill="url(#band)"/>
  <rect x="24" y="72" width="208" height="3" fill="#0f7f50" opacity="0.18"/>
  <g fill="#ffffff" opacity="0.92">
    <circle cx="84" cy="47" r="7.5"/>
    <circle cx="128" cy="47" r="7.5"/>
    <circle cx="172" cy="47" r="7.5"/>
  </g>

  <!-- the twig: a stem with three branches -->
  <g fill="none" stroke="url(#stem)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 96 C70 132 62 170 68 210" stroke-width="11"/>
    <path d="M66 122 C78 121 88 116 98 110" stroke-width="8"/>
    <path d="M65 161 C78 161 88 156 98 150" stroke-width="8"/>
    <path d="M67 199 C80 199 90 194 100 188" stroke-width="8"/>
  </g>

  <!-- leaves (the notes): flat, two-tone, with a vein -->
  <g id="leaves">
    <g transform="translate(96 111) rotate(-24)">
      <path d="M0 0 C11 -17 36 -18 48 -2 C36 13 11 13 0 0 Z" fill="#21b26d"/>
      <path d="M0 0 C11 -17 36 -18 48 -2 Z" fill="#4ad68f"/>
      <path d="M3 -0.5 L44 -2" stroke="#0f8a52" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </g>
    <g transform="translate(96 151) rotate(-24)">
      <path d="M0 0 C11 -17 36 -18 48 -2 C36 13 11 13 0 0 Z" fill="#21b26d"/>
      <path d="M0 0 C11 -17 36 -18 48 -2 Z" fill="#4ad68f"/>
      <path d="M3 -0.5 L44 -2" stroke="#0f8a52" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </g>
    <g transform="translate(98 189) rotate(-24)">
      <path d="M0 0 C11 -17 36 -18 48 -2 C36 13 11 13 0 0 Z" fill="#21b26d"/>
      <path d="M0 0 C11 -17 36 -18 48 -2 Z" fill="#4ad68f"/>
      <path d="M3 -0.5 L44 -2" stroke="#0f8a52" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </g>
    <!-- the bud at the top of the stem -->
    <g transform="translate(66 98) rotate(-102) scale(0.62)">
      <path d="M0 0 C11 -17 36 -18 48 -2 C36 13 11 13 0 0 Z" fill="#21b26d"/>
      <path d="M0 0 C11 -17 36 -18 48 -2 Z" fill="#4ad68f"/>
    </g>
  </g>

  <!-- note text beside each leaf -->
  <g fill="#c9d6cf">
    <rect x="152" y="93" width="58" height="9" rx="4.5"/>
    <rect x="152" y="108" width="40" height="9" rx="4.5"/>
    <rect x="152" y="133" width="58" height="9" rx="4.5"/>
    <rect x="152" y="148" width="48" height="9" rx="4.5"/>
    <rect x="154" y="171" width="56" height="9" rx="4.5"/>
    <rect x="154" y="186" width="34" height="9" rx="4.5"/>
  </g>
</svg>
