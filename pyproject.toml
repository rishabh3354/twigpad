[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twigpad"
dynamic = ["version"]
description = "Fast, simple hierarchical notes editor: a tree of notes with the text beside it, saved as .hjt files"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Twigpad contributors" }]
requires-python = ">=3.8"
dependencies = ["PyQt5>=5.15"]
keywords = ["notes", "outliner", "notebook", "hierarchical", "tree", "hjt", "knowledge base", "pim"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Text Editors",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
twigpad = "twigpad.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "twigpad.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twigpad = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
